name: Homeku PR2 exact-head verification
on:
  push:
    branches:
      - ci/homeku-v1.3-pr2-verification
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed PR commit
        uses: actions/checkout@v4
        with:
          ref: 55af0f0b3570be464b55c3c34bd628e699402f4c
          persist-credentials: false
      - name: Assert exact PR HEAD is under test
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "55af0f0b3570be464b55c3c34bd628e699402f4c"
          echo "Verified PR HEAD 55af0f0b3570be464b55c3c34bd628e699402f4c"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r scripts/requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Run Python suite on PR HEAD
        run: python -m unittest discover -s tests -v
