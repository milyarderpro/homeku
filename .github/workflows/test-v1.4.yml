name: Homeku v1.4 CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/save-analysis.yml'
      - '.github/workflows/test-v1.4.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm exact PR head under test
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "Verified exact PR HEAD: $(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies and FFmpeg
        run: |
          set -euo pipefail
          # Use the same pinned FFmpeg as the production save workflow.
          python -m pip install -r scripts/requirements.txt "imageio-ffmpeg==0.6.0"
          ffmpeg_exe="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$ffmpeg_exe"
          mkdir -p "$RUNNER_TEMP/homeku-bin"
          ln -s "$ffmpeg_exe" "$RUNNER_TEMP/homeku-bin/ffmpeg"
          echo "$RUNNER_TEMP/homeku-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/homeku-bin/ffmpeg" -hide_banner -version
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run complete regression and parallel suite
        run: python -m unittest discover -s tests -v
      - name: Verify no accidental changes to protected data
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
