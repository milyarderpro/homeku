name: Homeku - Test JPG Extraction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeku-test-jpg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Safety gate - test branch only
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/actions-jpg-test" ]]; then
            echo "ERROR: Select branch actions-jpg-test, not main."
            exit 1
          fi

      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        shell: bash
        run: |
          python -m pip install 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Extract and verify JPGs
        shell: bash
        run: |
          test -s tests/dreamsHouse002.mp4 || { echo 'Upload tests/dreamsHouse002.mp4 into branch actions-jpg-test first'; exit 1; }
          python scripts/action_jpg_smoke.py \
            --video tests/dreamsHouse002.mp4 \
            --output "tests/output/jpg-smoke-${GITHUB_RUN_ID}"

      - name: Commit JPGs to test branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "tests/output/jpg-smoke-${GITHUB_RUN_ID}/"
          git commit -m "test: verify five JPGs extracted by GitHub Actions (run ${GITHUB_RUN_ID})"
          git push origin HEAD:actions-jpg-test
