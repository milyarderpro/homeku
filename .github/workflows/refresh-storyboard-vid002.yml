name: Homeku - One-time VID-002 Storyboard Refresh

on:
  push:
    branches:
      - main
    paths:
      - requests/refresh-storyboard-vid002.json

permissions:
  contents: write

concurrency:
  group: homeku-vid002-storyboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production HEAD
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image and YAML dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Generate one replacement storyboard and validate package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          import yaml
          from PIL import Image
          sys.path.insert(0, "scripts")
          from storyboard import generate_storyboard
          from validate_analysis import validate

          root = Path("references/VID-002")
          request = json.loads(Path("requests/refresh-storyboard-vid002.json").read_text(encoding="utf-8"))
          assert request == {
              "target": "references/VID-002/storyboard.jpg",
              "expected_existing_blob_sha": "55bf34ef57e672fce5561e36195435d866bdb551",
              "source_video": "video/dreamsHouse002.mp4",
              "source_video_blob_sha": "9a3795dc12e327ec864aac30baef2d79b93f6231",
              "revision": "approved-portrait-grid-v2",
          }, "Unexpected refresh request: abort"
          def blob_sha(path):
              return subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()

          before = {
              file.name: blob_sha(f"references/VID-002/{file.name}")
              for file in root.iterdir() if file.is_file()
          }
          assert len(before) == 7, "Unexpected package file count"
          assert blob_sha("video/dreamsHouse002.mp4") == request["source_video_blob_sha"]
          assert before["storyboard.jpg"] == request["expected_existing_blob_sha"], "Storyboard was changed; abort"

          data = yaml.safe_load((root/"analysis.yaml").read_text(encoding="utf-8"))
          assert data["video"]["id"] == "VID-002"
          assert data["video"]["filename"] == "dreamsHouse002.mp4"
          shots = data["shots"]
          assert len(shots) == data["video"]["shot_count"] == 4, "Unexpected shot count"
          frames = [root / f"shot-{i:02d}.jpg" for i in range(1, len(shots) + 1)]
          assert all(frame.is_file() for frame in frames)

          generate_storyboard(frames, root/"storyboard.jpg",
                              video=data["video"], architecture=data["architecture"], shots=shots)
          with Image.open(root/"storyboard.jpg") as im:
              assert im.format == "JPEG"
              assert im.size == (1104, 651), f"Unexpected layout: {im.size}"
              im.verify()

          result = validate(root, "VID-002")
          assert len(result["files"]) == 7
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert changed == ["references/VID-002/storyboard.jpg"], f"Unexpected changes: {changed}"
          print("Verified 4 portrait columns, 7 valid files, only storyboard changed")
          PY

      - name: Commit only storyboard.jpg
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- references/VID-002/storyboard.jpg
          test "$(git diff --cached --name-only)" = "references/VID-002/storyboard.jpg"
          git commit -m "visual: refresh VID-002 storyboard with approved portrait grid"
          git push origin HEAD:main

      - name: Verify committed storyboard on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          with Image.open(Path("references/VID-002/storyboard.jpg")) as image:
              assert image.size == (1104, 651)
              image.verify()
          print("Storyboard replacement is now on main")
          PY
