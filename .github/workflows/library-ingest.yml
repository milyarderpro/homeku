name: Library ingest

on:
  push:
    paths:
      - 'incoming/*.zip'
      - 'video/*.mp4'
      - 'tools/**'
      - 'docs/contracts/**'
      - 'data/taxonomy.json'
      - 'requirements.txt'
      - '.github/workflows/library-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

# Every run scans all incoming ZIPs on the latest default branch.
concurrency:
  group: homeku-library-publication
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Ingest and publish latest branch snapshot
        env:
          HOMEKU_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/publish_actions.py
      - name: Keep technical ingest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homeku-ingest-report
          path: ${{ runner.temp }}/homeku-ingest-report.json
          if-no-files-found: warn
