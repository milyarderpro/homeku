name: Homeku - Save Video Analysis v1.2

on:
  push:
    branches:
      - main
    paths:
      - requests/save.json

permissions:
  contents: write

concurrency:
  group: homeku-save-${{ github.ref }}
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r scripts/requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Test validation and action processing
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Process approved request and validate full package
        id: process
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          python scripts/save_analysis_action.py \
            --root . --branch "$GITHUB_REF_NAME" > "$RUNNER_TEMP/homeku-result.json"
          cat "$RUNNER_TEMP/homeku-result.json"
          STATUS=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/homeku-result.json")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" == "saved" ]]; then
            VIDEO_ID=$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["video_id"])' "$RUNNER_TEMP/homeku-result.json")
            echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit complete analysis and result together
        if: steps.process.outputs.status == 'saved'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "references/${{ steps.process.outputs.video_id }}" requests/result.json
          git commit -m "analysis: save ${{ steps.process.outputs.video_id }} from approved request"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Verify saved files in the remote branch
        if: steps.process.outputs.status == 'saved'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          ID="${{ steps.process.outputs.video_id }}"
          test -f "references/$ID/analysis.yaml"
          test -f "references/$ID/analysis.md"
          test -f "references/$ID/storyboard.jpg"
          python scripts/validate_analysis.py "references/$ID" --id "$ID"
