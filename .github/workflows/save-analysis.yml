name: Homeku - Parallel Save v1.4

on:
  push:
    branches: [main]
    paths:
      - 'requests/pending/*.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Existing requests/pending/<video-id>.json for same-request recovery'
        required: true
        type: string

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -r scripts/requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Test validation and parallel processing
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Save exactly one approved filename-based request
        shell: bash
        env:
          HOMEKU_EVENT: ${{ github.event_path }}
          HOMEKU_EVENT_NAME: ${{ github.event_name }}
          HOMEKU_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python scripts/parallel_save.py \
            --root . \
            --event "$HOMEKU_EVENT" \
            --event-name "$HOMEKU_EVENT_NAME" \
            --trigger-sha "$HOMEKU_TRIGGER_SHA"
