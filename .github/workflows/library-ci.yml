name: Library checks

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'schemas/**'
      - 'audit/**'
      - 'data/**'
      - 'references/**'
      - 'catalogs/**'
      - 'knowledge/**'
      - 'sources/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-audit-motion.txt'
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'audit/**'
      - 'schemas/**'
      - 'data/**'
      - 'references/**'
      - 'catalogs/**'
      - 'knowledge/**'
      - 'sources/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'requirements-audit-motion.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audit-motion.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Test isolated fixtures and capacity
        run: python -m unittest discover -s tests -t . -v
      - name: Verify active library against a full rebuild
        run: python tools/library.py check
      - name: Verify reusable chat input kit
        run: python tools/build_audit_kit.py --check

      - name: Test optional motion helper
        run: |
          python -m pip install -r requirements-audit-motion.txt
          python -m unittest tests.test_motion_analysis -v
