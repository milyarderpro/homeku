# VIDEO ANALYSIS ONLY — no ideas, prompts, or generation instructions.
# Duplicate the shots[] item for every shot. Use null for unknown information.
# Draft chat: video.id=PENDING. GitHub Actions assigns final VID-001, VID-002, etc. on save.
# Shot IDs: shot-01, shot-02, shot-03, etc. (maximum 99 per video; v1.3 analysis workflow).
# Image filenames: shot-01.jpg, shot-02.jpg, etc. (always two digits for shots 1-99).
# Technical labels: English snake_case; descriptive notes may be Indonesian.
# v1.3: ChatGPT reviews YAML + Indonesian shot_narratives in chat; scripts/save_analysis_action.py renders Markdown without AI. This YAML template has NO narrative fields.
# Keep analysis.yaml as source of truth; final Markdown uses relative shot-NN.jpg image src. Runner fills final keyframe paths.
# building_scale stores visual impressions and approximate area ranges (m²); do not imply measured dimensions.
# common_regions is a broad stylistic association, never a verified home location or regional prevalence ranking.
schema_version: "2.1"
video:
  id: PENDING # draft only; finalized to VID-XXX by GitHub Actions after save now
  filename: video_XXXX.mp4 # must exactly match the basename of main/video/<filename>.mp4
  duration_s: null
  resolution: null # e.g. "720x1280"
  fps: null
  aspect_ratio: null # e.g. "9:16"
  shot_count: null

architecture:
  primary_style: null # inferred style, not a verified geographic origin
  common_regions: [] # north_america / south_america / europe / asia / africa / oceania; [] when unknown
  building_scale:
    perceived_size: null # tiny / small / medium / large / estate
    building_form: null # e.g. narrow_elongated, rectangular, l_shaped
    vertical_scale: null # e.g. single_story, single_story_with_possible_loft
    footprint: null # compact / moderate / expansive
    estimated_floor_area_m2:
      min: null # rough visual estimate in m², not actual measurement
      max: null
    confidence: null # low / medium / high

  secondary_influences: []
  exterior_features: [] # roof, walls, porch, windows, doors, materials
  interior_style: []
  style_confidence: null # low / medium / high

visual_style:
  dominant_colors: [] # e.g. [{name: sage_green, hex_approx: "#A6B2A0"}]
  lighting: [] # e.g. [soft_daylight, warm_practical_lamps]
  setting: [] # environment and landscaping, visibly supported
  season_appearance: null # visually suggested season; not a confirmed date
  mood: [] # e.g. [cozy, calm, nostalgic]

video_structure:
  type: null # e.g. home_tour
  scene_sequence: [] # same order as shots[]
  overall_pace: null # slow / moderate / fast
  transition_pattern: null

shots:
  - id: shot-01
    start_s: null
    end_s: null
    scene: null # exterior_front / living_room / kitchen / ...
    framing: { start: null, end: null, view_angle: null }
    camera:
      movements: [] # dolly_in, tracking_right, pan_left, etc.
      speed: null
    focal_subject: null
    # Detailed observation across the FULL shot, not only the saved keyframe.
    # Write factual, specific English snake_case tags with color/material/size/position when visible.
    # Exterior architecture: white_horizontal_wood_siding, tall_black_framed_windows.
    # Interior architecture: exposed_wood_ceiling_beams, light_wood_appearance_flooring.
    # Furniture: cream_fabric_sofa_facing_stone_fireplace, wood_table_between_two_chairs.
    # Environment: large_tree_with_yellow_leaves_left_of_house, distant_mountain_silhouette.
    # Interior window views may also belong in environment. [] when nothing is visible.
    # Do not infer actual location, exact material or season from appearance alone.
    visible_details:
      architectural: []
      furniture_and_props: []
      environment: []
    lighting: null
    transition_out: null
    keyframe: null # draft can be null; runner generates references/VID-XXX/shot-01.jpg at save
    confidence: { camera: null, visual_details: null }
    observation_note: null

analysis_quality:
  status: draft # draft / reviewed
  human_verified: false
  timestamp_precision: estimated
  uncertainties: []
  notes: null
