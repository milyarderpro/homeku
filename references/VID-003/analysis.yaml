analysis_quality:
  status: draft
  human_verified: false
  timestamp_precision: estimated
  uncertainties:
  - Estimasi luas 100–160 m² hanya dari proporsi visual; tidak ada dimensi atau denah
    yang terverifikasi.
  - Dormer mengisyaratkan ruang atap namun fungsi dan jumlah tingkat yang dapat dihuni
    belum pasti.
  - Istilah dolly, pan, dan tracking menyatakan gerakan visual yang tampak; tidak
    dapat dipastikan apakah kamera fisik, digital zoom, atau gerakan video sintetis.
  - Batas antar-shot diperkirakan pada frame terdekat; transisi eksterior ke interior
    menggunakan kilatan/dissolve singkat.
  - Penampilan musim hanyalah interpretasi dari dedaunan dan pencahayaan, bukan tanggal/lokasi
    asli.
  notes: Analisis khusus visual dari MP4 yang identik secara Git blob SHA dengan video
    sumber di main; semua gambar preview diambil dari frame asli. Terdapat letterboxing
    gelap bawaan pada bingkai vertikal.
